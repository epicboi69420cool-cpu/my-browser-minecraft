
<!DOCTYPE html>
<html>
<head>
<title>My Minecraft Server</title>
<style>
body {
  margin: 0;
  background: #111;
  color: white;
  font-family: Arial;
  text-align: center;
}
h1 {
  margin-top: 100px;
  font-size: 48px;
  text-shadow: 3px 3px #555;
}
button {
  display: block;
  width: 280px;
  padding: 16px;
  margin: 14px auto;
  background: #777;
  border: 3px solid #333;
  color: white;
  font-size: 18px;
  cursor: pointer;
}
button:hover {
  background: #999;
}
#login { display: none; }
</style>
</head>
<body>

<h1>MY MINECRAFT SERVER</h1>

<div id="menu">
  <button onclick="showLogin()">Multiplayer</button>
  <button onclick="alert('Coming soon!')">Options</button>
</div>

<div id="login">
  <h2>Join the Server</h2>
  <input id="username" placeholder="Choose username">
  <br><br>
  <button onclick="register()">Register</button>
  <p id="message"></p>
  <button onclick="back()">Back</button>
</div>

<script>
function showLogin() {
  document.getElementById('menu').style.display = 'none';
  document.getElementById('login').style.display = 'block';
}

function back() {
  document.getElementById('login').style.display = 'none';
  document.getElementById('menu').style.display = 'block';
}

function register() {
  const name = document.getElementById('username').value.trim();
  if (!/^[a-zA-Z0-9_]{3,16}$/.test(name)) {
    document.getElementById('message').innerText =
      'Username must be 3-16 letters, numbers or underscores.';
    return;
  }
  document.getElementById('message').innerText =
    'Registration demo! Account system coming soon.';
}
</script>

</body>
</html>
